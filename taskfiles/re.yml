# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

vars:
  GHIDRA_VERSION: "12.1.4"
  GHIDRA_BUILD: "20260921"
  GHIDRA_SHA256: "ddac49f903da9d5bac833e5cc79395098b9c33cfd3279be5f31bd00387d2d4db"
  GHIDRA_JAVA: "temurin-21"
  GHIDRA_ROOT: '{{.HOME}}/.local/opt/ghidra/ghidra_{{.GHIDRA_VERSION}}_PUBLIC'
  GHIDRA_HEADLESS: '{{if eq OS "darwin"}}/opt/homebrew/opt/ghidra/libexec/support/analyzeHeadless{{else}}{{.GHIDRA_ROOT}}/support/analyzeHeadless{{end}}'
  GHIDRA_RUN: "mise exec java@{{.GHIDRA_JAVA}} --"

tasks:
  _install-java:
    internal: true
    desc: "Install the JDK Ghidra needs via mise"
    cmds:
      - mise install java@{{.GHIDRA_JAVA}}
    status:
      - mise where java@{{.GHIDRA_JAVA}} >/dev/null 2>&1

  _install-ghidra:
    internal: true
    desc: "Install Ghidra (Homebrew on macOS, pinned upstream zip on Linux) when missing; reverse-engineering prerequisite"
    deps: [_install-java]
    cmds:
      - |
        {{if eq OS "darwin"}}
        brew install ghidra
        {{else}}
        zip="$(mktemp -d)/ghidra.zip"
        curl -fsSL -o "$zip" "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_{{.GHIDRA_VERSION}}_build/ghidra_{{.GHIDRA_VERSION}}_PUBLIC_{{.GHIDRA_BUILD}}.zip"
        echo "{{.GHIDRA_SHA256}}  $zip" | sha256sum -c -
        mkdir -p "$(dirname "{{.GHIDRA_ROOT}}")"
        unzip -q "$zip" -d "$(dirname "{{.GHIDRA_ROOT}}")"
        rm -rf "$(dirname "$zip")"
        {{end}}
    status:
      - test -x "{{.GHIDRA_HEADLESS}}"

  test:
    desc: "Run the Beermat extractor self-test (synthetic TPF0 and fixtures, no exe needed)"
    cmds:
      - uv run tools/re/test_extract_beermat.py

  extract:
    desc: "Extract forms from vendor/dopewars-1999/DopeWars.exe into the gitignored vendor/dopewars-1999/re/"
    cmds:
      - uv run tools/re/extract_beermat.py

  apply-labels-check:
    desc: "Import DopeWars.exe into a throwaway Ghidra project and apply the extracted labels"
    deps: [extract, _install-ghidra, _install-java]
    cmds:
      - |
        proj="$(mktemp -d)"
        trap 'rm -rf "$proj"' EXIT
        out="$(timeout 600 {{.GHIDRA_RUN}} {{.GHIDRA_HEADLESS}} "$proj" dw -import vendor/dopewars-1999/DopeWars.exe -scriptPath tools/re/ghidra -postScript ApplyLabels.java vendor/dopewars-1999/re/labels.csv -deleteProject </dev/null 2>&1)" || { echo "$out"; exit 1; }
        echo "$out" | rg "ApplyLabels:|ERROR"
        if echo "$out" | rg -q "ERROR"; then exit 1; fi

  decompile:
    desc: "Decompile every function in DopeWars.exe into the gitignored vendor/dopewars-1999/re/decompiled/"
    deps: [extract, _install-ghidra, _install-java]
    cmds:
      - |
        proj="$(mktemp -d)"
        trap 'rm -rf "$proj"' EXIT
        rm -rf vendor/dopewars-1999/re/decompiled
        out="$(timeout 1800 {{.GHIDRA_RUN}} {{.GHIDRA_HEADLESS}} "$proj" dw -import vendor/dopewars-1999/DopeWars.exe -scriptPath tools/re/ghidra -postScript ApplyLabels.java vendor/dopewars-1999/re/labels.csv -postScript DiscoverFunctions.java -postScript ExportDecompiled.java vendor/dopewars-1999/re/decompiled -deleteProject </dev/null 2>&1)" || { echo "$out"; exit 1; }
        echo "$out" | rg "ApplyLabels:|DiscoverFunctions:|ExportDecompiled:|ERROR"
        uv run tools/re/check_decompiled.py
