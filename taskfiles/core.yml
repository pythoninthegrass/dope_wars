# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3.0"

vars:
  MOJO_VERSION: "1.1.0"
  MARKDOWNLINT_VERSION: "0.49.1"

tasks:
  _install-venv:
    internal: true
    desc: "Create the uv venv and install the pinned Mojo if not already present"
    dir: core
    cmds:
      - uv venv --python 3.13 --allow-existing
      - uv pip install "mojo=={{.MOJO_VERSION}}"
    status:
      - test -x {{.ROOT_DIR}}/core/.venv/bin/mojo
      - .venv/bin/mojo --version 2>/dev/null | grep -q "Mojo {{.MOJO_VERSION}} "

  _install-markdownlint:
    internal: true
    desc: "Install the pinned markdownlint-cli globally via npm when missing or stale (task lint prerequisite)"
    cmds:
      - npm install -g "markdownlint-cli@{{.MARKDOWNLINT_VERSION}}"
    status:
      - command -v markdownlint
      - markdownlint --version | grep -qx "{{.MARKDOWNLINT_VERSION}}"

  _install-mise-tools:
    internal: true
    desc: "Install every tool pinned in .tool-versions via mise (e.g. watchexec, godot, task itself)"
    cmds:
      - mise install
    status:
      - mise which watchexec >/dev/null 2>&1

  build:
    desc: "Build core/build-output/lib/libdopewars.a from the Mojo sources"
    deps: [_install-venv]
    dir: core
    vars:
      # Mojo defaults to the host CPU, so a build host with AVX-512 emits code that traps (SIGILL) elsewhere. Linux x86-64 is the only distributed non-native target; macOS arm64 stays host-native.
      MOJO_CPU_FLAGS:
        sh: '[ "$(uname -s)-$(uname -m)" = "Linux-x86_64" ] && echo "--target-cpu x86-64-v3" || true'
    cmds:
      - mkdir -p build-output/lib
      - .venv/bin/mojo build src/abi.mojo --emit object {{.MOJO_CPU_FLAGS}} -o build-output/dopewars-raw.o
      # On ELF, Mojo's `--emit object` output carries its runtime's symbols as
      # globals, so everything outside the dw_* set is demoted to local here.
      # The ABI contract (docs/abi-contract.md, "The two sets are equal") says
      # the archive's global defined set must be exactly the dw_* declarations
      # in include/dopewars.h; the keep list is generated from the header, so
      # the gate cannot drift from the contract. On Mach-O the object already
      # satisfies the contract and no objcopy exists; check_abi_exports.py is
      # the enforcement either way.
      - |
        set -eu
        python3 ../tools/abi_symbols.py > build-output/dopewars.exports.txt
        if command -v objcopy >/dev/null 2>&1; then
          objcopy --keep-global-symbols=build-output/dopewars.exports.txt \
            build-output/dopewars-raw.o build-output/dopewars.o
        else
          # objcopy is absent on macOS. Nothing to demote there: mojo's Mach-O
          # object defines only the dw_* globals and leaves the runtime symbols
          # undefined for the final link. Either way, check_abi_exports.py
          # below is the contract, not this step.
          cp build-output/dopewars-raw.o build-output/dopewars.o
        fi
        ar rcs build-output/lib/libdopewars.a build-output/dopewars.o
      # AC#1 of TASK-001.05: the archive's global defined set must contain no
      # non-dw_* symbol. Runs on the archive, so it needs no compiler.
      - python3 ../tools/check_abi_exports.py build-output/lib/libdopewars.a
      # TASK-012.05 AC#3: no AVX-512 beyond the x86-64-v3 baseline. Only meaningful where the baseline flag applies.
      - test -z "{{.MOJO_CPU_FLAGS}}" || python3 ../tools/check_cpu_baseline.py build-output/lib/libdopewars.a
    sources:
      - "src/**/*.mojo"
      - "../include/dopewars.h"
      - "../tools/abi_symbols.py"
      - "../tools/check_abi_exports.py"
      - "../tools/check_cpu_baseline.py"
    generates:
      - build-output/lib/libdopewars.a

  test:
    desc: "Replay the JS oracle fixtures against the Mojo core (TASK-001.04 parity gate)"
    deps: [_install-venv]
    dir: core
    cmds:
      - |
        status=0
        for f in ../tests/mojo/*_test.mojo; do
          echo "== $f"
          .venv/bin/mojo run -I src -I ../tests/mojo "$f" || status=1
        done
        exit $status

  # The static archive cannot be dlopen'd: it is not position-independent and
  # ctypes needs a dynamic object. The conformance suite therefore runs against
  # a throwaway shared object linked from the same archive, which is also where
  # the Mojo runtime gets linked in explicitly -- the archive does not carry it
  # and a plain `cc -shared` will not find it on its own.
  abi:shared-lib:
    desc: "Link a throwaway conformance .so from libdopewars.a so ctypes can dlopen it"
    deps: [build]
    dir: core
    cmds:
      - |
        set -eu
        rt_dir=$(.venv/bin/python -c \
          'import pathlib,sys; print(next(p for p in pathlib.Path(sys.prefix).rglob("libKGENCompilerRTShared.*")).parent)')
        mkdir -p build-output/lib
        # --whole-archive: the archive's members are only pulled in on demand, so
        # a plain link would drop every dw_* symbol nothing here references yet.
        # ld64 spells the same thing -force_load with the archive attached.
        if [ "$(uname)" = "Darwin" ]; then
          whole='-Wl,-force_load,build-output/lib/libdopewars.a'
        else
          whole='-Wl,--whole-archive build-output/lib/libdopewars.a -Wl,--no-whole-archive'
        fi
        cc -shared -o build-output/lib/libdopewars.so \
          $whole \
          -L"$rt_dir" -lKGENCompilerRTShared -Wl,-rpath,"$rt_dir"
        # The gate runs against the .so too, since that is the artifact the C ABI
        # is actually served from during conformance testing.
        python3 ../tools/check_abi_exports.py build-output/lib/libdopewars.so
    sources:
      - build-output/lib/libdopewars.a
    generates:
      - build-output/lib/libdopewars.so

  abi:header-check:
    desc: "Compile core/abitest/abi_header_check.c: proves include/dopewars.h is self-consistent as C11"
    dir: core
    cmds:
      - mkdir -p build-output/abi-header-check
      - |
        set -eu
        rt_dir=$(.venv/bin/python -c \
          'import pathlib,sys; print(next(p for p in pathlib.Path(sys.prefix).rglob("libKGENCompilerRTShared.*")).parent)')
        cc -std=c11 -Wall -Wextra -Werror -I../include \
          -o build-output/abi-header-check/abi_header_check \
          abitest/abi_header_check.c \
          build-output/lib/libdopewars.so \
          -L"$rt_dir" -lKGENCompilerRTShared -Wl,-rpath,"$rt_dir"
        build-output/abi-header-check/abi_header_check
    deps: [abi:shared-lib]
    sources:
      - abitest/abi_header_check.c
      - "../include/dopewars.h"
    generates:
      - build-output/abi-header-check/abi_header_check

  abitest:
    desc: "Tier-C ABI conformance (Python/ctypes) against the built library"
    deps: [abi:shared-lib]
    dir: core
    cmds:
      - python3 abitest/abi_conformance_test.py --lib build-output/lib/libdopewars.so

  test:check-generated:
    desc: "Fail if tests/mojo/fixtures.mojo is stale with respect to tests/fixtures/*.jsonl"
    dir: core
    cmds:
      - node ../tests/fixtures/gen-mojo.mjs
      - git diff --exit-code -- ../tests/mojo/fixtures.mojo

  abitest:mojo:
    desc: "Tier-C ABI conformance (Mojo external_call) built against the static library"
    summary: |
      core/abitest/abitest.mojo reaches the compiled core exclusively through
      include/dopewars.h via std.ffi.external_call, never by importing a core
      module (checked separately by tools/validate_abi_test_purity.py). This is
      the second Tier-C driver, alongside the ctypes suite in core:abitest;
      it reaches the library through a different FFI mechanism, so a binding
      bug in one driver does not hide in the other.
    deps: [build]
    dir: core
    cmds:
      - .venv/bin/mojo build abitest/abitest.mojo -o build-output/abitest -Xlinker build-output/lib/libdopewars.a
      - ./build-output/abitest
    sources:
      - "abitest/**/*.mojo"
      - "src/**/*.mojo"
    generates:
      - build-output/abitest
