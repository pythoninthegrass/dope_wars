# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3.0"

tasks:
  run:
    desc: "Launch the game/ project in Godot"
    cmds:
      - godot --path game

  import:
    desc: "Headless Godot import of the game/ project (populates .godot/ cache)"
    deps: [":extension:build"]
    dir: game
    cmds:
      - |
        for i in 1 2 3 4 5; do
          godot --headless --frame-delay 800 --path . --import && exit 0
          echo "game:import attempt $i/5 crashed (see godotengine/godot#111048); retrying..." >&2
        done
        exit 1

  smoke-test:
    desc: "Boot the real game headlessly and verify it comes up without script errors"
    deps: [":game:import"]
    dir: game
    cmds:
      # --quit-after because the main scene is now the game rather than a test
      # harness: it has no reason to quit on its own, and a scene that hangs
      # would stall the pipeline instead of failing it. Real assertions about
      # what the game renders live in game:ui-test.
      - timeout 300 godot --headless --path . --quit-after 2

  # The bridge test needs the generated expectations to exist before Godot
  # imports the project, or the resource is not in the .godot/ cache and load()
  # returns null for the wrong reason. Hence gen before import rather than a
  # dependency of the test itself.
  #
  # The godot invocation is wrapped in `timeout` deliberately: a scene that never
  # reaches get_tree().quit() -- because a script error aborted _ready partway,
  # which Godot reports and then keeps spinning the main loop -- would otherwise
  # hang the pipeline indefinitely rather than failing it. The test also enforces
  # a minimum assertion count internally, so "ran and did nothing" fails fast
  # instead of hanging or passing.
  bridge-test:
    desc: "Godot -> GDExtension -> C ABI -> Mojo bridge integration test"
    deps: [":gen:bridge-expectations", ":game:import"]
    dir: game
    cmds:
      - timeout 300 godot --headless --path . --scene res://godot_tests/bridge_test.tscn

  # The script-driven companion to bridge-test: drives the full forwarded ABI
  # (lifecycle, buy/sell/travel/finances, dump->load->dump) through
  # godot --script, while the scene test above value-checks the generated
  # pointer-free surface. Same timeout rationale as bridge-test.
  bridge-test-script:
    desc: "Script-driven bridge integration test over the full forwarded ABI"
    deps: [":game:import"]
    dir: game
    cmds:
      - timeout 300 godot --headless --path . --script res://tests/test_bridge.gd

  # TASK-001.06. Drives the real Main scene through the same entry points the
  # keyboard and the buttons use, and asserts on rendered widget state. Same
  # timeout rationale as bridge-test, and same anti-false-pass assertion floor.
  ui-test:
    desc: "Presentation-layer regression test: boot, buy/sell, travel, persistence"
    deps: [":game:import"]
    dir: game
    cmds:
      - timeout 300 godot --headless --path . --scene res://godot_tests/ui_flow_test.tscn

  # TASK-001.06 AC#4. Run from the repo root because the tool resolves paths
  # relative to its own location, not to the task's dir.
  boundary-check:
    desc: "Fail if any script outside game/simulation/ references the GDExtension class"
    cmds:
      - uv run tools/validate_game_boundary.py
      - uv run tools/test_validate_game_boundary.py
