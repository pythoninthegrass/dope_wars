# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3.0"

set: ["e", "u", "pipefail"]
shopt: ["globstar"]

vars:
  MISE_SHIMS: "{{.HOME}}/.local/share/mise/shims"

env:
  PATH: "{{.MISE_SHIMS}}:{{.PATH}}"

includes:
  core: taskfiles/core.yml
  extension: taskfiles/extension.yml
  game: taskfiles/game.yml

tasks:
  default:
    desc: "List available tasks"
    cmds:
      - task --list

  submodules:
    desc: "Fetch git submodules (third_party/godot-cpp) if any aren't checked out yet"
    cmds:
      - git submodule update --init --recursive
    status:
      - test -z "$(git submodule status | grep '^-')"

  build:
    desc: "Build the full stack: Mojo core -> GDExtension shim"
    cmds:
      - task: core:build
      - task: extension:build

  abi:check:
    desc: "Static ABI gates (exporter single-source, conformance-test purity, export surface)"
    cmds:
      # One exporter: only core/src/abi.mojo may declare @export symbols.
      - python3 tools/validate_abi_exporter.py
      # Tier-C must reach the simulation only through the C ABI, never a core import.
      - python3 tools/validate_abi_test_purity.py
      # The header must parse, and its declarations must be unique.
      - python3 tools/abi_symbols.py --check

  abi:conformance:
    desc: "Tier-C ABI conformance: ctypes suite, Mojo external_call suite, C header check"
    cmds:
      - task: core:abitest
      - task: core:abitest:mojo
      - task: core:abi:header-check

  # Generates game/bridge_expectations.gd, the expected bridge surface derived
  # from include/dopewars.h. Two modes matter:
  #   task gen:bridge-expectations         write the file
  #   task gen:bridge-expectations:check   fail if it is stale with respect to the
  #                                        header, so a signature change cannot
  #                                        slip through with an expectation table
  #                                        still asserting the old values
  gen:bridge-expectations:
    desc: "Regenerate game/bridge_expectations.gd from include/dopewars.h"
    cmds:
      - python3 tools/gen_bridge_expectations.py

  gen:bridge-expectations:check:
    desc: "Fail if game/bridge_expectations.gd is stale with respect to include/dopewars.h"
    cmds:
      - python3 tools/gen_bridge_expectations.py --check

  bridge:test:
    desc: "Godot -> GDExtension -> C ABI -> Mojo bridge integration test (TASK-001.05 AC#4)"
    cmds:
      - task: gen:bridge-expectations:check
      - task: game:bridge-test

  bridge:test:script:
    desc: "Script-driven bridge test over the full forwarded ABI (res://tests/test_bridge.gd)"
    cmds:
      - task: game:bridge-test-script

  check:
    desc: "Mojo parity + ABI gates/conformance + bridge tests + presentation tests + Godot smoke test; non-zero exit on any failure"
    cmds:
      - task: core:test
      - task: abi:check
      - task: abi:conformance
      - task: game:boundary-check
      # bridge:test runs the staleness check itself, so it is not repeated here.
      - task: bridge:test
      - task: bridge:test:script
      - task: game:ui-test
      - task: game:smoke-test

  run:
    desc: "Build the full stack and launch the game (interactive)"
    cmds:
      - task: build
      - task: game:run

  loc:
    desc: "Non-vendor, non-generated LOC by language and the resulting Mojo share (target >=43%)"
    cmds:
      - ./scripts/loc.sh

  lint:
    desc: "markdownlint over the repo plus a boundary gate on core/src"
    deps: [core:_install-markdownlint]
    cmds:
      - markdownlint -c .markdownlint.jsonc .
      - ./scripts/check-core-boundaries.sh
