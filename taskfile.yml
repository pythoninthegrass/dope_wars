# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3.0"

set: ['e', 'u', 'pipefail']
shopt: ['globstar']

vars:
  MISE_SHIMS: "{{.HOME}}/.local/share/mise/shims"

env:
  PATH: "{{.MISE_SHIMS}}:{{.PATH}}"

includes:
  core: taskfiles/core.yml
  extension: taskfiles/extension.yml
  game: taskfiles/game.yml

tasks:
  default:
    desc: "List available tasks"
    cmds:
      - task --list

  submodules:
    desc: "Fetch git submodules (third_party/godot-cpp) if any aren't checked out yet"
    cmds:
      - git submodule update --init --recursive
    status:
      - test -z "$(git submodule status | grep '^-')"

  build:
    desc: "Build the full stack: Mojo core -> GDExtension shim"
    cmds:
      - task: core:build
      - task: extension:build

  check:
    desc: "Mojo parity tests + ABI conformance + full build + Godot smoke and bridge tests; non-zero exit on any failure"
    cmds:
      - task: core:test
      - task: core:abitest
      - task: game:smoke-test
      - task: game:bridge-test

  run:
    desc: "Build the full stack and launch the game (interactive)"
    cmds:
      - task: build
      - task: game:run

  loc:
    desc: "Non-vendor, non-generated LOC by language and the resulting Mojo share (target >=43%)"
    cmds:
      - ./scripts/loc.sh

  lint:
    desc: "markdownlint, the core/src boundary gate, and the ABI exporter/purity/symbol gates"
    cmds:
      - markdownlint -c .markdownlint.jsonc .
      - ./scripts/check-core-boundaries.sh
      - uv run tools/validate_abi_exporter.py
      - uv run tools/validate_abi_test_purity.py
      - uv run tools/validate_abi_symbols.py core/build-output/lib/libdopewars.a

